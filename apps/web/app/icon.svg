      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
