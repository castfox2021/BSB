[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "bsb-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "jsonschema>=4.23,<5", "httpx>=0.28,<1", "websockets>=15,<16", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema"]
[tool.setuptools.packages.find]
include = ["bsb_service*"]
[tool.ruff]
target-version = "py312"
extend-exclude = ["build", "*.egg-info"]
[tool.mypy]
ignore_missing_imports = true
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
