[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "bsb-manual-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "websockets>=15,<16", "PyJWT>=2.10,<3", "python-dotenv>=1.0,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[tool.setuptools.packages.find]
include = ["manual_assistant*"]
[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "build", "*.egg-info"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
