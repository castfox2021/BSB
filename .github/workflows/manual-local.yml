name: Manual Local Assistant
on: [push, pull_request]
jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --project services/manual-assistant --python 3.12 --extra dev --locked
      - run: services/manual-assistant/.venv/bin/ruff check services/manual-assistant
      - run: services/manual-assistant/.venv/bin/mypy services/manual-assistant/manual_assistant
      - run: npm run manual:test
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @bsb/web
